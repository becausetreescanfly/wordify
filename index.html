<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

  <main id="vocab-game">
    <h1>Deutsch Vokabeltrainer</h1>
    <div id="mode-switch">
      <button id="learn-mode-btn" type="button">Lernmodus</button>
      <button id="quiz-mode-btn" type="button" class="active">Quizmodus</button>
    </div>
    <div id="learn-area" style="display:none;">
      <h2>Vokabeln lernen</h2>
      <div id="learn-list"></div>
      <button id="start-quiz-btn" type="button">Quiz starten</button>
    </div>
    <div id="game-container">
      <div id="question-area">
        <span id="english-word"></span>
      </div>
      <div id="choices-area">
        <!-- Auswahlmöglichkeiten werden hier eingefügt -->
      </div>
      <div id="hint-btn-wrapper">
        <button id="hint-btn" type="button">Tipp anzeigen</button>
      </div>
      <div id="progress-area">
        <span id="progress"></span>
        <div id="progressbar-wrapper">
          <div id="progressbar"></div>
        </div>
      </div>
      <div id="result-area" style="display:none;">
        <h2>Ergebnis</h2>
        <p id="score"></p>
        <button id="restart-btn">Nochmal spielen</button>
      </div>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>

</html>
